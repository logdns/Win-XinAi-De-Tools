name: Verify Existing Installers

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful package-build run ID (same repository)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installer:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: Win-XinAi-De-Tools-Setup-win-x86
            filename: Win-XinAi-De-Tools-Setup-x86.exe
            edition: WinUI
          - runner: windows-11-arm
            artifact: Win-XinAi-De-Tools-MyGo-Setup-win-arm64
            filename: Win-XinAi-De-Tools-MyGo-Setup-arm64.exe
            edition: MyGo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/installer-under-test
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify installed application, wizard launch and shortcuts
        shell: pwsh
        run: ./scripts/installer-smoke.ps1 -Installer artifacts/installer-under-test/${{ matrix.filename }} -Edition ${{ matrix.edition }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: installer-check-${{ matrix.edition }}
          path: artifacts/installer-smoke*
