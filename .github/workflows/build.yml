name: Build Win-XinAi-De-Tools

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$project = Get-Content Win-XinAi-De-Tools.csproj
          $version = @($project.Project.PropertyGroup.Version)[0]
          $expectedTag = "v$version"
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match project version '$expectedTag'."
          }
      - name: Run unit tests
        run: dotnet test Win-XinAi-De-Tools.Tests/Win-XinAi-De-Tools.Tests.csproj --configuration Release
      - name: Run Windows Firewall integration test
        shell: pwsh
        env:
          PORTMANAGER_RUN_INTEGRATION: "1"
        run: dotnet test Win-XinAi-De-Tools.Tests/Win-XinAi-De-Tools.Tests.csproj --configuration Release --no-build --filter "Category=WindowsIntegration"

  native-helpers:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test Rust WSL helper
        run: cargo test --locked --manifest-path native/wsl-helper-rust/Cargo.toml
      - name: Test Go WSL helper
        working-directory: native/wsl-helper-go
        run: go test ./...

  build:
    needs: [test, native-helpers]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Win-XinAi-De-Tools.csproj --runtime ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Audit direct and transitive dependencies
        shell: pwsh
        run: |
          dotnet list Win-XinAi-De-Tools.csproj package --vulnerable --include-transitive --format json > dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed." }
          $audit = Get-Content dependency-audit.json -Raw | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Vulnerable package: $($package.id)" }
              }
            }
          }
      - name: Build
        run: dotnet build Win-XinAi-De-Tools.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path obj -Recurse -Filter output.json -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName -Raw }
      - name: Publish portable app
        run: dotnet publish Win-XinAi-De-Tools.csproj --configuration Release --no-restore --runtime ${{ matrix.rid }} --self-contained true -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None -o artifacts/portable/${{ matrix.rid }}
      - name: Keep only Chinese and English resources
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/portable/${{ matrix.rid }}"
          $allowedCultures = @("en", "en-US", "zh", "zh-CN", "zh-Hans")
          $culturePattern = '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures } |
            Remove-Item -Recurse -Force

          $unexpected = Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures }
          if ($unexpected) {
            throw "Unexpected language resources: $($unexpected.Name -join ', ')"
          }
      - name: Add portable package instructions
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/portable/${{ matrix.rid }}"
          $architecture = '${{ matrix.installer_arch }}'
          $instructions = @"
          Win-XinAi-De-Tools ${{ github.ref_name }}

          Architecture: $architecture

          Choose the package matching your Windows system:
            x64   - Intel/AMD 64-bit Windows (most PCs)
            x86   - 32-bit Windows
            arm64 - Windows on ARM devices

          Run Win-XinAi-De-Tools.exe as administrator. The app requires administrator
          permission to manage Windows Firewall and network settings.

          If the program does not open, verify that the package architecture
          matches Settings > System > About > System type.
          "@
          Set-Content -Path "$publishDirectory\README.txt" -Value $instructions -Encoding UTF8
      - name: Smoke test packaged application startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $executable = Join-Path $pwd "artifacts/portable/win-x64/Win-XinAi-De-Tools.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "Win-XinAi-De-Tools/startup.log"
          Remove-Item $logPath -Force -ErrorAction SilentlyContinue

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PortManagerWindowTest
          {
              [DllImport("user32.dll")]
              public static extern bool ShowWindowAsync(IntPtr window, int command);
              [DllImport("user32.dll")]
              public static extern bool IsIconic(IntPtr window);
              [DllImport("user32.dll")]
              public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll")]
              public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll", EntryPoint = "GetClassLongPtrW")]
              public static extern IntPtr GetClassLongPtr(IntPtr window, int index);
          }
          '@

          $process = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $dashboardLoaded = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match 'Application initialization failed|Unable to open the main window|Unexpected application error') {
                  throw "Application startup failed:`n$log"
                }
                if ($log -match 'Navigation completed: DashboardPage\.') {
                  $dashboardLoaded = $true
                  break
                }
              }
              if ($process.HasExited) {
                throw "Application exited during startup with code $($process.ExitCode)."
              }
            }

            if (-not $dashboardLoaded) {
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '<no startup log>' }
              throw "Dashboard did not load within 30 seconds:`n$log"
            }

            $log = Get-Content $logPath -Raw
            if ($log -notmatch 'Tray icon initialized\.') {
              throw "The notification-area icon was not initialized:`n$log"
            }

            # Keep the real GUI alive long enough to catch Loaded-event and async startup failures.
            $cleanObservationDeadline = (Get-Date).AddSeconds(10)
            while ((Get-Date) -lt $cleanObservationDeadline) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Application exited after loading the dashboard with code $($process.ExitCode)."
              }
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match 'Application initialization failed|Unable to open the main window|Unexpected application error') {
                  throw "Application failed after loading the dashboard:`n$log"
                }
              }
            }

            $process.Refresh()
            $windowHandle = $process.MainWindowHandle
            if ($windowHandle -eq [IntPtr]::Zero) {
              throw "The application has no native main window handle."
            }

            $smallIcon = [PortManagerWindowTest]::SendMessage($windowHandle, 0x007F, [IntPtr]2, [IntPtr]::Zero)
            if ($smallIcon -eq [IntPtr]::Zero) {
              $smallIcon = [PortManagerWindowTest]::GetClassLongPtr($windowHandle, -34)
            }
            $largeIcon = [PortManagerWindowTest]::SendMessage($windowHandle, 0x007F, [IntPtr]1, [IntPtr]::Zero)
            if ($largeIcon -eq [IntPtr]::Zero) {
              $largeIcon = [PortManagerWindowTest]::GetClassLongPtr($windowHandle, -14)
            }
            if ($smallIcon -eq [IntPtr]::Zero -or $largeIcon -eq [IntPtr]::Zero) {
              throw "The native window icon was not applied."
            }

            [PortManagerWindowTest]::ShowWindowAsync($windowHandle, 6) | Out-Null
            Start-Sleep -Seconds 1
            if (-not [PortManagerWindowTest]::IsIconic($windowHandle)) {
              throw "The main window could not be minimized."
            }

            [PortManagerWindowTest]::ShowWindowAsync($windowHandle, 9) | Out-Null
            [PortManagerWindowTest]::PostMessage($windowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
            if (-not $process.WaitForExit(10000)) {
              throw "The application did not exit within 10 seconds after WM_CLOSE."
            }

            $log = Get-Content $logPath -Raw
            if ($log -notmatch 'Main window closed\.') {
              throw "The application exited without completing the window close handler:`n$log"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Exercise all pages, themes, layouts, and back navigation
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/ui-smoke.ps1 -Executable artifacts/portable/win-x64/Win-XinAi-De-Tools.exe
      - name: Upload UI verification screenshots and log
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-verification
          path: artifacts/ui-smoke
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/${{ matrix.rid }}/* -DestinationPath artifacts/Win-XinAi-De-Tools-${{ matrix.rid }}.zip
      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Win-XinAi-De-Tools-${{ matrix.rid }}
          path: artifacts/Win-XinAi-De-Tools-${{ matrix.rid }}.zip

  installer:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download portable build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Win-XinAi-De-Tools-${{ matrix.rid }}
          path: artifacts/download
      - name: Extract portable build
        shell: pwsh
        run: Expand-Archive artifacts/download/Win-XinAi-De-Tools-${{ matrix.rid }}.zip artifacts/installer-source
      - name: Download Simplified Chinese installer language
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --location `
            https://raw.githubusercontent.com/jrsoftware/issrc/1ae7bf81dc0d2013235dfe4bb0b6f4e4a0b6b25c/Files/Languages/ChineseSimplified.isl `
            --output installer/ChineseSimplified.isl
      - name: Build installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content Win-XinAi-De-Tools.csproj
          $version = @($project.Project.PropertyGroup.Version)[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\artifacts\installer-source" "/DBuildArch=${{ matrix.installer_arch }}" "/DAppVersion=$version" installer/Win-XinAi-De-Tools.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Win-XinAi-De-Tools-Setup-${{ matrix.rid }}
          path: artifacts/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build, installer]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: Win-XinAi-De-Tools-*
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets -Recurse -File | Sort-Object Name
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          New-Item -ItemType Directory release-assets/checksums | Out-Null
          $checksums | Set-Content release-assets/checksums/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -Recurse -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --verify-tag `
            --generate-notes `
            @assets
